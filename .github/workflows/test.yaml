name: CI
on: [workflow_dispatch, pull_request, push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # upsetplot 0.9.0 (Dec 2023) is the latest release and breaks under numpy>=2.4:
          # it passes array-valued coordinates to ax.text(), and numpy 2.4 turned
          # ndim>0 -> scalar conversion into a TypeError. The upstream fix exists only as
          # an unmerged PR (jnothman/UpSetPlot#302); install that branch, pinned to its
          # commit, until it lands. See TODO.md.
          pip install "upsetplot @ git+https://github.com/durr1602/UpSetPlot.git@7fa2661b7989e733bfce8a668f864084b8390afd"
          pip install -e ".[dev]" "pandas<3"
      - name: Run tests
        run: nbdev-test
      - name: Check notebooks and library are in sync
        run: |
          nbdev-export
          if [ -n "$(git status --porcelain -uno)" ]; then
            echo "::error::Notebooks and library are out of sync. Run nbdev-export locally and commit the updated .py files."
            git diff
            exit 1
          fi
